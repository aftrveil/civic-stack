# Minimal required check for auto-merge (set up Nov 16, 2026, approved by Kate).
# Bot PRs merge automatically only after this "ci" job passes.
name: ci

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm ci
      - name: lint
        run: npm run lint
      - name: build
        run: npm run build
